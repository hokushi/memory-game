services:
  db:
    image: postgres:17
    container_name: memory-game-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # スキーマは Drizzle が管理する（backend で `pnpm db:push`）。
      # ここでは空の DB を立てるだけ。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DB を GUI で見るための pgAdmin（http://localhost:8080）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memory-game-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # 起動時に memory-game サーバーを自動登録する
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin:
