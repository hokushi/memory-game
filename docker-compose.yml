services:
  db:
    image: postgres:17
    container_name: memory-game-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # スキーマは Drizzle が管理する（backend で `pnpm db:push`）。
      # ここでは空の DB を立てるだけ。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  # バックエンド（Fastify）。tsx watch でホットリロード。
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: memory-game-backend
    restart: unless-stopped
    environment:
      NODE_ENV: local
      PORT: 3002
      HOST: 0.0.0.0
      # コンテナ内からは localhost ではなく db サービス名で繋ぐ
      DATABASE_URL: postgres://postgres:postgres@db:5432/memory_game
      # 写真アップロード用 S3。バケットは各自のものに合わせて変更する。
      AWS_REGION: ap-northeast-1
      S3_BUCKET: hokushi-memory-game-884375106358-ap-northeast-1-an
      # 通知メールの送信元。SES で検証済みのアドレスにすること。
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      # Cognito（ユーザーとパスワードの置き場）。
      # 秘密の値ではない（これだけでは何もできない）ので直書きしてよい。
      COGNITO_USER_POOL_ID: ap-northeast-1_1rUvjxHYD
      COGNITO_CLIENT_ID: 1l4l8s2o48ml1hqcesp6d9j06a
      # 認証情報はホストの環境変数から渡す（未設定なら空で起動はするが
      # アップロード時に失敗する）。`export AWS_ACCESS_KEY_ID=...` 等で渡す。
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # イベント送信先の別アプリ。コンテナ内からはサービス名で繋ぐ。
      EXTERNAL_API_URL: http://external-api:3003
      # 利用登録でもらった ID と、署名用の秘密鍵（base64）。
      # 秘密鍵はここに直書きせず、git 管理外の .env から差し込む。
      EXTERNAL_API_CLIENT_ID: ${EXTERNAL_API_CLIENT_ID:-}
      EXTERNAL_API_PRIVATE_KEY: ${EXTERNAL_API_PRIVATE_KEY:-}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ソースだけマウントしてホットリロード（node_modules はイメージ側を使う）
      - ./backend/src:/app/backend/src

  # 別アプリ（external-api）用の PostgreSQL。
  # memory-game とは DB ごと分ける（外部サービスという想定なので、
  # 同じ DB を覗きに行けてしまうと「別アプリ」にならない）。
  # ホストからは 5433 で繋ぐ（5432 は memory-game が使っている）。
  external-db:
    image: postgres:17
    container_name: external-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: external_api
    ports:
      - "5433:5432"
    volumes:
      - externalpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d external_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 別アプリ（Fastify、画面なし）。memory-game から見た「外部API」。
  external-api:
    build:
      context: .
      dockerfile: external-api/Dockerfile.dev
    container_name: external-api
    restart: unless-stopped
    environment:
      NODE_ENV: local
      PORT: 3003
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@external-db:5432/external_api
      # 呼び出し元の認証は clients テーブルの公開鍵で行うので、共有の秘密は持たない
    ports:
      - "3003:3003"
    depends_on:
      external-db:
        condition: service_healthy
    volumes:
      - ./external-api/src:/app/external-api/src

  # DB を GUI で見るための pgAdmin（http://localhost:8080）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memory-game-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # 起動時に memory-game / external-api の2サーバーを自動登録する
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - db
      - external-db
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  externalpgdata:
  pgadmin:
