services:
  db:
    image: postgres:17
    container_name: memory-game-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # スキーマは Drizzle が管理する（backend で `pnpm db:push`）。
      # ここでは空の DB を立てるだけ。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  # バックエンド（Fastify）。tsx watch でホットリロード。
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: memory-game-backend
    restart: unless-stopped
    environment:
      NODE_ENV: local
      PORT: 3002
      HOST: 0.0.0.0
      # コンテナ内からは localhost ではなく db サービス名で繋ぐ
      DATABASE_URL: postgres://postgres:postgres@db:5432/memory_game
      JWT_SECRET: dev-secret-change-me
      # 写真アップロード用 S3。バケットは各自のものに合わせて変更する。
      AWS_REGION: ap-northeast-1
      S3_BUCKET: hokushi-memory-game-884375106358-ap-northeast-1-an
      # 認証情報はホストの環境変数から渡す（未設定なら空で起動はするが
      # アップロード時に失敗する）。`export AWS_ACCESS_KEY_ID=...` 等で渡す。
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ソースだけマウントしてホットリロード（node_modules はイメージ側を使う）
      - ./backend/src:/app/backend/src

  # DB を GUI で見るための pgAdmin（http://localhost:8080）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memory-game-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # 起動時に memory-game サーバーを自動登録する
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin:
